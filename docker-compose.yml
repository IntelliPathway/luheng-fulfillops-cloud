services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: luheng
      POSTGRES_USER: luheng
      POSTGRES_PASSWORD: luheng-dev-only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luheng -d luheng"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - luheng_pg:/var/lib/postgresql/data

  api:
    image: luheng-fulfillops-api:local
    build:
      context: ./backend
      args:
        INSTALL_HARNESS: ${INSTALL_HARNESS:-false}
    environment:
      DATABASE_URL: postgresql+psycopg://luheng:luheng-dev-only@postgres:5432/luheng
      CORS_ORIGINS: http://localhost:4177
      ALLOW_DEV_HEADER_AUTH: "true"
      ALLOW_DEV_TOKEN: "true"
      AUTH_JWT_SECRET: luheng-compose-development-secret-change-me
      OIDC_ISSUER: luheng-local
      OIDC_AUDIENCE: luheng-fulfillops
      RUNTIME_JWT_SECRET: luheng-compose-runtime-secret-change-me
      JOB_EXECUTION_MODE: external
      JOB_LEASE_SECONDS: ${JOB_LEASE_SECONDS:-60}
      WORKER_STALE_SECONDS: ${WORKER_STALE_SECONDS:-30}
      FULFILLOPS_ENABLE_DSH_RUNTIME: ${FULFILLOPS_ENABLE_DSH_RUNTIME:-false}
      FULFILLOPS_INTERNAL_URL: http://127.0.0.1:8000
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 12
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    image: luheng-fulfillops-api:local
    build:
      context: ./backend
      args:
        INSTALL_HARNESS: ${INSTALL_HARNESS:-false}
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://luheng:luheng-dev-only@postgres:5432/luheng
      JOB_EXECUTION_MODE: external
      JOB_LEASE_SECONDS: ${JOB_LEASE_SECONDS:-60}
      WORKER_STALE_SECONDS: ${WORKER_STALE_SECONDS:-30}
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-1}
      WORKER_ID: fulfillops-worker-1
      WORKER_QUEUES: default
      AUTH_JWT_SECRET: luheng-compose-development-secret-change-me
      RUNTIME_JWT_SECRET: luheng-compose-runtime-secret-change-me
      FULFILLOPS_ENABLE_DSH_RUNTIME: ${FULFILLOPS_ENABLE_DSH_RUNTIME:-false}
      FULFILLOPS_INTERNAL_URL: http://api:8000
      FULFILLOPS_DSH_ROOT: /var/lib/luheng/dsh
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    volumes:
      - luheng_dsh:/var/lib/luheng/dsh
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker", "--healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      api:
        condition: service_healthy

  web:
    image: node:22-alpine
    working_dir: /workspace
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 4177"
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    volumes:
      - .:/workspace
      - web_modules:/workspace/node_modules
    ports:
      - "4177:4177"
    depends_on:
      api:
        condition: service_healthy

volumes:
  luheng_pg:
  luheng_dsh:
  web_modules:
