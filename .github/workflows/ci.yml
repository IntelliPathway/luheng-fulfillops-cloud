name: FulfillOps CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: fulfillops-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: luheng_test
          POSTGRES_USER: luheng
          POSTGRES_PASSWORD: luheng
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U luheng -d luheng_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Lint and test backend with PostgreSQL upgrade
        working-directory: backend
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://luheng:luheng@127.0.0.1:5432/luheng_test
        run: |
          python -m ruff check app tests
          python -m pytest -q
      - name: Smoke signed financial ledger
        run: ./scripts/smoke-v09-financial-ledger.sh
      - name: Smoke maker-checker reconciliation
        run: ./scripts/smoke-v10-reconciliation.sh

      - name: Install frontend dependencies
        run: npm ci
      - name: Test and build frontend
        run: |
          npm run test:domain
          npm run build
          npm run test:sites
      - name: Verify generated hosting artifacts
        run: |
          test -f dist/client/index.html
          test -f dist/server/index.js
          test -f dist/.openai/hosting.json
