[project]
name = "luheng-fulfillops-api"
version = "0.4.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "SQLAlchemy==2.0.43",
  "psycopg[binary]==3.2.10",
  "pydantic==2.13.5",
  "PyJWT[crypto]==2.10.1",
]

[project.optional-dependencies]
test = ["httpx==0.28.1", "pytest==8.4.1"]
harness = ["deepseek-harness-sdk==0.1.5rc1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
