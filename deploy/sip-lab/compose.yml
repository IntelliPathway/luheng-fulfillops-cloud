services:
  asterisk:
    build: .
    restart: "no"
    ports:
      - "${SIP_LAB_BIND_ADDRESS:-127.0.0.1}:5060:5060/udp"
      - "127.0.0.1:8088:8088/tcp"
      - "${SIP_LAB_BIND_ADDRESS:-127.0.0.1}:10000-10019:10000-10019/udp"
    volumes:
      - ./generated:/run/sip-lab:ro
      - ./http.conf:/etc/asterisk/http.conf:ro
      - ./extensions.conf:/etc/asterisk/extensions.conf:ro
      - ./rtp.conf:/etc/asterisk/rtp.conf:ro
      - ./modules.conf:/etc/asterisk/modules.conf:ro
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETUID, SETGID]
    security_opt: [no-new-privileges:true]
  media:
    profiles: [media]
    build:
      context: ../..
      dockerfile: deploy/sip-lab/media.Dockerfile
    restart: "no"
    depends_on: [asterisk]
    environment:
      APP_ENV: development
      ENABLE_SIP_LAB: "true"
      SIP_LAB_MEDIA_ACKNOWLEDGED: "${SIP_LAB_MEDIA_ACKNOWLEDGED:-false}"
      SIP_LAB_MEDIA_MODE: "${SIP_LAB_MEDIA_MODE:-echo}"
      SIP_LAB_LOCAL_VOICE_ACKNOWLEDGED: "${SIP_LAB_LOCAL_VOICE_ACKNOWLEDGED:-false}"
      SIP_LAB_QWEN_VOICE_ACKNOWLEDGED: "${SIP_LAB_QWEN_VOICE_ACKNOWLEDGED:-false}"
    volumes:
      - ./generated:/run/sip-lab:ro
      - media-journal:/var/lib/media-lab
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE, SETUID, SETGID]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 20s
volumes:
  media-journal:
